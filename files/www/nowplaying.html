<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Now playing</title>
<style>
  :root { --bg: #0b0b0f; --text: #f4f4f7; --muted: #8e8e99; --accent: #3b8cf6; }
  * { box-sizing: border-box; user-select: none; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
    font-family: "Inter", "Noto Sans", "DejaVu Sans", system-ui, sans-serif; }
  .backdrop { position: fixed; inset: -40px; background-size: cover; background-position: center;
    filter: blur(40px) brightness(.35) saturate(1.2); opacity: 0; transition: opacity .6s; }
  .backdrop.on { opacity: 1; }
  .wrap { position: relative; height: 100%; display: flex; align-items: center; gap: 32px; padding: 0 40px 0 36px; }
  .art { flex: none; width: 320px; height: 320px; border-radius: 18px; overflow: hidden;
    background: linear-gradient(145deg, #1e3a66, #101018); display: grid; place-items: center;
    box-shadow: 0 20px 50px -10px rgba(0,0,0,.7); }
  .art img { width: 100%; height: 100%; object-fit: cover; display: none; }
  .art svg { width: 110px; height: 110px; color: rgba(255,255,255,.55); }
  .art.has img { display: block; } .art.has svg { display: none; }
  .info { flex: 1; min-width: 0; }
  .pill { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; letter-spacing: .08em;
    text-transform: uppercase; color: var(--accent); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: currentColor; }
  .playing .dot { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .25 } }
  h1 { margin: 14px 0 8px; font-size: 32px; line-height: 1.15; font-weight: 800;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .artist { font-size: 21px; color: var(--text); opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .album { margin-top: 6px; font-size: 16px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fmt { display: none; margin-top: 16px; font-size: 13px; font-weight: 700; letter-spacing: .06em;
    text-transform: uppercase; padding: 6px 11px; border-radius: 999px; background: rgba(255,255,255,.08);
    color: var(--muted); }
  .fmt.on { display: inline-block; }
  .fmt.lossless { color: #30d158; background: rgba(48,209,88,.12); }
  .hint { margin-top: 18px; font-size: 16px; line-height: 1.5; color: var(--muted); }
  .hint b { color: var(--text); }
  .art { width: min(320px, 42vw, 66vh); height: min(320px, 42vw, 66vh); }
  @media (min-width: 1100px) and (min-height: 650px) {
    .art { width: min(520px, 42vw, 66vh); height: min(520px, 42vw, 66vh); }
    h1 { font-size: 48px; } .artist { font-size: 30px; } .album { font-size: 22px; }
  }
  @media (max-aspect-ratio: 5/4) {
    .wrap { flex-direction: column; justify-content: center; text-align: center; padding: 24px; gap: 22px; }
    .art { width: min(78vw, 46vh); height: min(78vw, 46vh); }
    .info { flex: none; width: 100%; }
  }
  body.spotify { --accent: #1ed760; }
  body.spotify .art { background: linear-gradient(145deg, #145c32, #101018); }
  .btn { margin-top: 18px; display: none; border: 0; border-radius: 999px; padding: 11px 18px; font: inherit;
    font-size: 15px; font-weight: 700; color: #0b0b0f; background: var(--accent); }
  .btn.on { display: inline-block; }
  body.bluetooth { --accent: #7b8cff; }
  body.themed { --accent: var(--art) !important; }
  #viz { display: none; width: 100%; height: 64px; margin-top: 16px; }
  body.viz #viz { display: block; }
  body.full .art, body.full .album, body.full .hint, body.full .btn, body.full .fmt { display: none !important; }
  body.full .wrap { flex-direction: column; justify-content: flex-end; align-items: stretch; padding: 24px 36px 30px; }
  body.full .info { display: flex; flex-direction: column; height: 100%; }
  body.full #viz { order: 9; flex: 1; height: auto; margin-top: 18px; }
  body.full h1 { font-size: 30px; margin: 10px 0 4px; }
  body.bluetooth .art { background: linear-gradient(145deg, #2a3170, #101018); }
  body.caldera .art { background: linear-gradient(145deg, #7a3a12, #101018); }
  body.dlna .art { background: linear-gradient(145deg, #1d5a3e, #101018); }
  body.roon .art { background: linear-gradient(145deg, #2c3a7a, #101018); }
  body.snapcast .art { background: linear-gradient(145deg, #6b4a12, #101018); }
  .btn.ghost { background: rgba(255,255,255,.1); color: var(--text); margin-left: 8px; }
  html, body { touch-action: pan-x pan-y; } /* plexpie-nopinch: no accidental pinch-zoom on the touchscreen */
  * { scrollbar-width: none; } ::-webkit-scrollbar { display: none; } /* plexpie-noscrollbar: touch scrolling, no desktop scroll bars */
</style>
</head>
<body>
<div class="backdrop" id="bg"></div>
<div class="wrap">
  <div class="art" id="art">
    <img id="img" alt="">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 17a9 9 0 1 1 14 0"/><path d="M8.5 14.5a5 5 0 1 1 7 0"/><path d="M12 15l4 6H8z"/></svg>
  </div>
  <div class="info" id="info">
    <div class="pill"><span class="dot"></span><span id="status">Ready</span></div>
    <h1 id="title">AirPlay</h1>
    <div class="artist" id="artist"></div>
    <div class="album" id="album"></div>
    <div class="fmt" id="fmt"></div>
    <div class="hint" id="hint"></div>
    <button class="btn" id="browse">Browse Spotify on this screen</button>
    <canvas id="viz"></canvas>
    <button class="btn" id="pair">Pair a device</button><button class="btn ghost" id="stoppair">Stop</button>
  </div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const SRC = (["spotify", "bluetooth", "caldera", "dlna", "roon", "snapcast"].find(k => location.pathname.startsWith("/" + k))) || "airplay";
document.body.classList.add(SRC);
let artKey = null;

const ICON_SPOTIFY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M7.5 9.5c3-1 6.5-.7 9 .8M8 12.6c2.5-.8 5.3-.5 7.4.7M8.6 15.4c2-.6 4-.4 5.7.5"/></svg>';
const ICON_BT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7l10 10-5 5V2l5 5L7 17"/></svg>';
if (SRC === "spotify") document.querySelector(".art svg").outerHTML = ICON_SPOTIFY;
if (SRC === "bluetooth") document.querySelector(".art svg").outerHTML = ICON_BT;
const ICON_CALDERA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="7" height="12" rx="1.5"/><rect x="14" y="7" width="7" height="12" rx="1.5"/><circle cx="6.5" cy="14.5" r="1.8"/><circle cx="17.5" cy="14.5" r="1.8"/><path d="M8.5 4.5c2-1.3 5-1.3 7 0"/></svg>';
if (SRC === "caldera") document.querySelector(".art svg").outerHTML = ICON_CALDERA;
// UPnP/DLNA, Roon and Snapcast: speakers other apps play to
const RECEIVERS = {
  dlna: {via: "UPnP / DLNA", icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8M12 17v4"/><path d="M9 11l2 2 4-4"/></svg>',
    hint: n => `In an app like <b>BubbleUPnP</b>, <b>mconnect</b> or your NAS's music app, pick <b>${n}</b> as the speaker (renderer).`},
  roon: {via: "Roon", icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M8 12a4 4 0 0 1 8 0"/><circle cx="12" cy="12" r="1.5"/></svg>',
    hint: n => `In <b>Roon</b>, open <b>Settings › Audio</b>, enable this player once, then pick it as a zone. Track details show in the Roon app.`},
  snapcast: {via: "Snapcast", icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h3l3-7 4 14 3-7h3"/></svg>',
    hint: (n, s) => s.server === false ? "Looking for your Snapcast server. Set its address in Settings › Configuration › Snapcast for track details."
      : `Play to your Snapcast server (Music Assistant, Mopidy, Spotify…). This player joins the group it's in.`},
};
if (RECEIVERS[SRC]) document.querySelector(".art svg").outerHTML = RECEIVERS[SRC].icon;
$("img").addEventListener("error", () => { $("art").classList.remove("has"); $("bg").classList.remove("on"); });
const btPost = (action) => fetch("/api/bluetooth", {method: "POST", headers: {"Content-Type": "application/json"},
  body: JSON.stringify({action})}).then(poll);
$("pair").onclick = () => btPost("pair");
$("stoppair").onclick = () => btPost("stop");
const mmss = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
function renderBt(s) {
  const b = s.bluetooth || {};
  const has = !!(b.title || b.artist);
  $("info").classList.toggle("playing", !!b.playing);
  $("status").textContent = b.playing ? "Playing via Bluetooth" : b.connected ? `Connected: ${b.connected}` : "Bluetooth";
  $("title").textContent = has ? (b.title || "Unknown track") : (b.connected ? "Play something on your device" : s.player_name);
  $("artist").textContent = b.artist || "";
  $("album").textContent = b.album || "";
  const f = b.connected && b.codec ? `${b.codec} · Bluetooth · lossy` : "";
  $("fmt").textContent = f; $("fmt").className = "fmt" + (f ? " on" : "");
  const pairing = (b.pairing_left || 0) > 0;
  let hint = "";
  if (b.available === false) hint = "Bluetooth isn't ready on this player. Try <b>Settings → System → Reboot</b>.";
  else if (pairing) hint = `Now visible as <b>${s.player_name}</b>. On your phone, tablet or computer, open <b>Bluetooth settings</b> and tap <b>${s.player_name}</b>. (${mmss(b.pairing_left)})`;
  else if (!b.connected) hint = (b.devices || []).length
    ? `Open <b>Settings → Bluetooth</b> on a paired device and tap <b>${s.player_name}</b>, or pair a new one.`
    : "Tap <b>Pair a device</b>, then pick this player in your phone, tablet or computer's Bluetooth settings.";
  $("hint").innerHTML = has ? "" : hint;
  $("pair").classList.toggle("on", b.available !== false && !pairing && !b.playing);
  $("stoppair").classList.toggle("on", pairing);
}

// ---- album-art color and visualizer
let es = null, mode = "bars", frame = null, lastFrame = 0;
function theme(s) {
  document.body.classList.toggle("themed", !!s.accent);
  if (s.accent) document.body.style.setProperty("--art", s.accent);
  mode = s.visualizer || "bars";
  const playing = !!((["bluetooth", "spotify", "caldera", "dlna", "roon", "snapcast"].includes(SRC) ? s[SRC] : s.airplay) || {}).playing;
  const want = mode !== "off" && playing;
  document.body.classList.toggle("viz", want);
  if (!want) document.body.classList.remove("full");
  if (want && !es) { es = new EventSource("/api/meter"); es.onmessage = e => { frame = JSON.parse(e.data); lastFrame = Date.now(); }; }
  if (!want && es) { es.close(); es = null; frame = null; }
}
$("art").addEventListener("click", () => { if (document.body.classList.contains("viz")) document.body.classList.add("full"); });
$("viz").addEventListener("click", () => document.body.classList.toggle("full"));
function draw() {
  requestAnimationFrame(draw);
  const c = $("viz"); if (!document.body.classList.contains("viz") || !c.clientWidth) return;
  const dpr = devicePixelRatio || 1, W = c.clientWidth, H = c.clientHeight;
  if (c.width !== W * dpr || c.height !== H * dpr) { c.width = W * dpr; c.height = H * dpr; }
  const x = c.getContext("2d"); x.setTransform(dpr, 0, 0, dpr, 0, 0); x.clearRect(0, 0, W, H);
  const col = getComputedStyle(document.body).getPropertyValue("--accent").trim() || "#3b8cf6";
  const f = (Date.now() - lastFrame < 1500 && frame) || {};
  if (mode === "vu" || !(f.bands || []).length) {
    const bars = [["L", f.l], ["R", f.r]], h = Math.min(18, H / 3);
    bars.forEach(([lab, db], i) => {
      const y = H / 2 - h - 4 + i * (h + 8), lvl = Math.max(0, Math.min(1, ((db ?? -60) + 60) / 60));
      x.fillStyle = "rgba(255,255,255,.08)"; x.fillRect(22, y, W - 22, h);
      const g = x.createLinearGradient(22, 0, W, 0); g.addColorStop(0, col); g.addColorStop(.8, col); g.addColorStop(.92, "#ffd166"); g.addColorStop(1, "#ff5a4f");
      x.fillStyle = g; x.fillRect(22, y, (W - 22) * lvl, h);
      x.fillStyle = "rgba(255,255,255,.6)"; x.font = "bold 12px system-ui"; x.fillText(lab, 4, y + h - 4);
    });
    return;
  }
  const b = f.bands, n = b.length, gap = Math.max(2, W / n * 0.22), bw = (W - gap * (n - 1)) / n;
  x.fillStyle = col;
  b.forEach((v, i) => { const bh = Math.max(2, v * H); x.globalAlpha = 0.55 + 0.45 * v;
    x.beginPath(); x.roundRect ? x.roundRect(i * (bw + gap), H - bh, bw, bh, Math.min(3, bw / 2)) : x.rect(i * (bw + gap), H - bh, bw, bh); x.fill(); });
  x.globalAlpha = 1;
}
requestAnimationFrame(draw);

function renderReceiver(s) {
  const r = RECEIVERS[SRC], c = s[SRC] || {};
  const has = !!(c.title || c.artist);
  $("info").classList.toggle("playing", !!c.playing);
  $("status").textContent = c.playing ? `Playing via ${r.via}` : (has ? "Paused" : `Ready for ${r.via}`);
  $("title").textContent = has ? (c.title || "Unknown track") : (c.playing ? r.via : s.player_name);
  $("artist").textContent = c.artist || "";
  $("album").textContent = c.album || "";
  $("fmt").textContent = ""; $("fmt").className = "fmt";
  $("hint").innerHTML = (has || c.playing) ? "" : r.hint(s.player_name, c);
  const url = c.art || "";
  if (url !== artKey) {
    artKey = url;
    if (url) { $("img").src = url; $("art").classList.add("has"); $("bg").style.backgroundImage = `url(${url})`; $("bg").classList.add("on"); }
    else { $("art").classList.remove("has"); $("bg").classList.remove("on"); }
  }
}

function renderCaldera(s) {
  const c = s.caldera || {};
  const has = !!(c.title || c.artist);
  $("info").classList.toggle("playing", !!c.playing);
  $("status").textContent = c.playing ? "Playing via Caldera" : (has ? "Paused" : "Ready for Caldera");
  $("title").textContent = has ? (c.title || "Unknown track") : (c.playing ? "Caldera Music" : s.player_name);
  $("artist").textContent = c.artist || "";
  $("album").textContent = c.album || "";
  $("fmt").textContent = ""; $("fmt").className = "fmt";
  $("hint").innerHTML = (has || c.playing) ? "" : `In <b>Plexamp</b> on your phone, tablet or computer, tap the speaker icon and pick <b>${s.player_name} (Caldera)</b>. Other Caldera speakers can join it there for multi-room.`;
}

function render(s) {
  theme(s);
  if (SRC === "bluetooth") return renderBt(s);
  if (SRC === "caldera") return renderCaldera(s);
  if (RECEIVERS[SRC]) return renderReceiver(s);
  const a = (SRC === "spotify" ? s.spotify : s.airplay) || {};
  const has = !!(a.title || a.artist);
  const via = SRC === "spotify" ? "Spotify Connect" : "AirPlay";
  $("info").classList.toggle("playing", !!a.playing);
  $("status").textContent = a.playing ? `Playing via ${via}` : (has ? "Paused" : `Ready for ${via}`);
  $("title").textContent = has ? (a.title || "Unknown track") : s.player_name;
  $("artist").textContent = a.artist || "";
  $("album").textContent = a.album || "";
  const f = SRC === "spotify" ? (has ? "Ogg Vorbis · 320 kbps · lossy" : "") : (a.format || "");
  $("fmt").textContent = f;
  $("fmt").className = "fmt" + (f ? " on" : "") + (/lossless/i.test(f) ? " lossless" : "");
  $("hint").innerHTML = has ? "" : (SRC === "spotify"
    ? `Open the <b>Spotify</b> app on your phone, tablet or computer, tap the devices icon and pick <b>${s.player_name}</b>. Needs Spotify Premium.`
    : `On your iPhone or Mac, open <b>Control Center → AirPlay</b> and pick <b>${s.player_name}</b>.`);
  $("browse").classList.toggle("on", SRC === "spotify" && !!(s.spotify || {}).web);
  const url = SRC === "spotify" ? (a.art_url || "") : (a.has_art ? "/api/art?v=" + s.art_ver : "");
  if (url !== artKey) {
    artKey = url;
    if (url) {
      $("img").src = url;
      $("art").classList.add("has");
      $("bg").style.backgroundImage = `url(${url})`;
      $("bg").classList.add("on");
    } else {
      $("art").classList.remove("has");
      $("bg").classList.remove("on");
    }
  }
}
$("browse").onclick = () => fetch("/api/source", {method: "POST", headers: {"Content-Type": "application/json"},
  body: JSON.stringify({source: "spotify_web"})});
function poll() { fetch("/api/state").then(r => r.json()).then(render).catch(() => {}); }
poll(); setInterval(poll, 1000);
</script>
<script>/* plexpie-homekeys: Home key, Esc twice or the mouse Back button go home */
(() => { let last = 0; const home = () => fetch("/api/source", {method: "POST", headers: {"Content-Type": "application/json"}, body: '{"source":"home"}'});
  const typing = (el) => el && (/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName) || el.isContentEditable);
  addEventListener("keydown", e => { if (e.key === "Home" && !typing(e.target)) home();
    if (e.key === "Escape") { const n = Date.now(); if (n - last < 600) home(); last = n; } });
  addEventListener("mouseup", e => { if (e.button === 3) home(); }); })();</script>
</body>
</html>
