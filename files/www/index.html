<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>PlexPie</title>
<style>
  :root {
    --bg: #0b0b0f; --panel: #16161c; --line: #26262e; --text: #f4f4f7; --muted: #8e8e99;
    --plexamp: #f5a524; --apple: #fa3c5a; --airplay: #3b8cf6; --ma: #19c2a8; --spotify: #1ed760; --timer: #ff5a4f; --bt: #7b8cff; --ha: #41bdf5; --caldera: #ff8a3d; --ytm: #ff3355; --bbc: #ff7a2e; --lamp: #ffd166;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
    font-family: "Inter", "Noto Sans", "DejaVu Sans", system-ui, sans-serif; }
  body { display: grid; grid-template-rows: var(--hh, 54px) 1fr var(--fh, 76px); grid-template-columns: minmax(0, 1fr); height: 100vh;
    padding: 0 var(--pad, 14px); font-size: var(--fs, 16px); }

  header, footer { zoom: var(--z, 1); }
  body { transition: background-color .8s; }
  body.themed { background: radial-gradient(130% 75% at 50% -10%, color-mix(in srgb, var(--art) 30%, transparent), transparent 70%), var(--bg); }
  body.themed .np .chip { background: color-mix(in srgb, var(--art) 30%, var(--panel)); color: var(--art); }
  body.themed .bar b { background: var(--art); }
  header { display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--line); min-width: 0; overflow: hidden; }
  footer { min-width: 0; }
  .name { font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
  .np { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; justify-content: center; }
  .np .chip { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
    padding: 4px 9px; border-radius: 999px; background: var(--panel); color: var(--muted); white-space: nowrap; }
  .np .track { font-size: 15px; white-space: nowrap; overflow: hidden; min-width: 0; }
  .np .track span { display: inline-block; }
  /* a long title glides back and forth instead of pushing the screen wider */
  .np .track.long span { animation: glide var(--glide, 10s) ease-in-out infinite alternate; }
  @keyframes glide { 0%, 15% { transform: translateX(0); } 85%, 100% { transform: translateX(var(--dx, 0)); } }
  /* the playing tile shows the album cover */
  .tile .cover { position: absolute; inset: 0; border-radius: inherit; background-size: cover; background-position: center;
    opacity: 0; transition: opacity .6s; pointer-events: none; }
  .tile .cover::after { content: ""; position: absolute; inset: 0; border-radius: inherit;
    background: linear-gradient(180deg, rgba(10,10,14,.15) 0%, rgba(10,10,14,.55) 55%, rgba(10,10,14,.92) 100%); }
  .tile.has-cover .cover { opacity: 1; }
  .tile > *:not(.cover):not(.eq) { position: relative; z-index: 1; }
  .tile .eq { z-index: 1; }
  .tile > div { min-width: 0; max-width: 100%; }
  .tile.has-cover .sub { color: #fff; }
  .clock { font-size: 20px; font-variant-numeric: tabular-nums; font-weight: 600; }
  .gear { width: 40px; height: 40px; border: 0; border-radius: 12px; background: transparent; color: var(--muted);
    display: grid; place-items: center; margin-right: -6px; }
  .gear:active, .sleep:active { background: var(--panel); }
  .sleep { height: 40px; min-width: 40px; padding: 0 8px; border: 0; border-radius: 12px; background: transparent; color: var(--muted);
    display: inline-flex; align-items: center; gap: 6px; font: inherit; font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .sleep svg { width: 21px; height: 21px; }
  .sleep.on { color: #b79cff; background: color-mix(in srgb, #b79cff 16%, transparent); }
  .gear svg { width: 22px; height: 22px; }


  main { display: grid; grid-template-columns: repeat(var(--cols, 4), 1fr); grid-template-rows: repeat(var(--rows, 1), 1fr);
    gap: var(--gap, 12px); padding: var(--gap, 12px) 0; min-height: 0; }
  .tile { container-type: size; min-height: 0; position: relative; border: 0; border-radius: 22px; color: var(--text); text-align: left;
    padding: 18px; display: flex; flex-direction: column; justify-content: space-between;
    background: linear-gradient(160deg, color-mix(in srgb, var(--c) 34%, #16161c) 0%, #121217 70%);
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 30%, transparent); font: inherit;
    transition: transform .12s ease, filter .12s ease; }
  .tile:active { transform: scale(.97); filter: brightness(1.15); }
  .tile { padding: clamp(10px, 8cqmin, 28px); border-radius: clamp(14px, 9cqmin, 28px); }
  .tile svg { width: clamp(28px, 26cqmin, 110px); height: clamp(28px, 26cqmin, 110px); color: var(--c); }
  .tile .label { font-size: clamp(15px, 11cqmin, 34px); font-weight: 700; line-height: 1.15; }
  .tile .sub { margin-top: .35em; font-size: clamp(11px, 6.5cqmin, 18px); color: var(--muted); min-height: 1.3em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  @container (max-height: 150px) { .tile .sub { display: none; } }
  .tile.playing { box-shadow: inset 0 0 0 2px var(--c), 0 0 24px -6px var(--c); }
  .tile.playing .sub { color: var(--c); font-weight: 600; }
  .tile.off { filter: grayscale(1) brightness(.55); }
  .eq { position: absolute; top: 18px; right: 18px; display: none; gap: 3px; height: 18px; align-items: flex-end; }
  .tile.playing .eq { display: flex; }
  .eq i { width: 4px; background: var(--c); border-radius: 2px; animation: eq 0.9s ease-in-out infinite; }
  .eq i:nth-child(2) { animation-delay: -.3s } .eq i:nth-child(3) { animation-delay: -.6s }
  @keyframes eq { 0%,100% { height: 5px } 50% { height: 18px } }

  footer { display: flex; align-items: center; gap: 10px; border-top: 1px solid var(--line); }
  .btn { height: 52px; min-width: 52px; padding: 0 16px; border: 0; border-radius: 14px; background: var(--panel);
    color: var(--text); font: inherit; font-size: 15px; font-weight: 600; display: inline-flex; align-items: center;
    justify-content: center; gap: 8px; }
  .btn:active { filter: brightness(1.4); }
  .btn svg { width: 22px; height: 22px; }
  .vol { flex: 1; display: flex; align-items: center; gap: 10px; }
  .bar { flex: 1; height: 10px; border-radius: 999px; background: var(--panel); overflow: hidden; }
  .bar b { display: block; height: 100%; width: 0; background: var(--text); border-radius: inherit; transition: width .2s; }
  .sc { display: none; }
  .sc.on { background: color-mix(in srgb, var(--lamp) 28%, var(--panel)); color: var(--lamp);
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--lamp) 50%, transparent); }
  .sc span { max-width: 9em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* narrow (portrait) screens: room for the track title and the volume bar */
  @media (max-width: 760px) { .sc span { display: none; } }
  .bar { min-width: 70px; }
  @media (max-width: 600px) {
    .name { display: none; }
    #pauselabel, .sc span { display: none; }
    .btn { padding: 0 12px; }
    .vol { flex: 1; min-width: 120px; }
  }
  .volnum { width: 38px; font-size: 15px; text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
  html, body { touch-action: pan-x pan-y; } /* plexpie-nopinch: no accidental pinch-zoom on the touchscreen */
  * { scrollbar-width: none; } ::-webkit-scrollbar { display: none; } /* plexpie-noscrollbar: touch scrolling, no desktop scroll bars */
  /* someone asking to connect from a phone or tablet: approve right here (the screen is always admin) */
  #access { position: fixed; left: 50%; top: 14px; transform: translateX(-50%); z-index: 50; width: min(560px, calc(100% - 24px));
    background: #1c1c1f; border: 1px solid #ff9f0a88; border-radius: 16px; padding: 14px 16px; box-shadow: 0 12px 40px #000c; }
  #access b { display: block; font-size: 17px; margin-bottom: 2px; }
  #access small { color: #8e8e93; }
  #access .acts { display: flex; gap: 8px; margin-top: 10px; }
  #access button { flex: 1; border: 0; border-radius: 12px; padding: 12px; font-size: 15px; font-weight: 700; background: #2c2c30; color: #f4f4f7; }
  #access button.ok { background: #0a84ff; color: #fff; }
  #access button.no { color: #ff453a; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="access" class="hidden"></div>
<header>
  <div class="name" id="name">PlexPie</div>
  <div class="np"><span class="chip" id="npchip">Idle</span><span class="track" id="nptrack"><span></span></span></div>
  <button class="sleep" id="sleep" aria-label="Sleep timer" title="Sleep timer: tap for 15, 30, 45, 60, 90 minutes, off">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2 14h6l-6 6h6M12 4h5l-5 5h5M16 13h4l-4 4h4"/></svg><span id="sleepleft"></span></button>
  <div class="clock" id="clock">--:--</div>
  <button class="gear" id="gear" aria-label="Settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
  </button>
</header>

<main id="tiles">
  <button class="tile" data-src="plexamp" style="--c: var(--plexamp)">
    <span class="eq"><i></i><i></i><i></i></span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <path d="M4 10v4M8 6v12M12 3v18M16 7v10M20 10v4"/></svg>
    <div><div class="label">Plexamp</div><div class="sub">Your library</div></div>
  </button>
  <button class="tile" data-src="apple" style="--c: var(--apple)">
    <span class="eq"><i></i><i></i><i></i></span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>
    <div><div class="label">Apple Music</div><div class="sub">On this screen</div></div>
  </button>
  <button class="tile" data-src="airplay" style="--c: var(--airplay)">
    <span class="eq"><i></i><i></i><i></i></span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 17a9 9 0 1 1 14 0"/><path d="M8.5 14.5a5 5 0 1 1 7 0"/><path d="M12 15l4 6H8z"/></svg>
    <div><div class="label">AirPlay</div><div class="sub">iPhone, iPad, Mac</div></div>
  </button>
  <button class="tile" data-src="spotify" style="--c: var(--spotify)">
    <span class="eq"><i></i><i></i><i></i></span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <circle cx="12" cy="12" r="9.5"/><path d="M7 9.3c3.2-1 7-.7 9.8.9M7.6 12.6c2.7-.8 5.8-.5 8.1.8M8.3 15.7c2.1-.6 4.3-.4 6.2.6"/></svg>
    <div><div class="label">Spotify</div><div class="sub">Spotify Connect</div></div>
  </button>
  <button class="tile" data-src="bluetooth" style="--c: var(--bt)">
    <span class="eq"><i></i><i></i><i></i></span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7 7l10 10-5 5V2l5 5L7 17"/></svg>
    <div><div class="label">Bluetooth</div><div class="sub">Any device</div></div>
  </button>
  <button class="tile" data-src="ma" style="--c: var(--ma)">
    <span class="eq"><i></i><i></i><i></i></span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M14 13v4"/><circle cx="12.5" cy="17" r="1.5"/></svg>
    <div><div class="label">Music Assistant</div><div class="sub">Checking…</div></div>
  </button>
  <button class="tile" data-src="caldera" style="--c: var(--caldera)">
    <span class="eq"><i></i><i></i><i></i></span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="7" width="7" height="12" rx="1.5"/><rect x="14" y="7" width="7" height="12" rx="1.5"/><circle cx="6.5" cy="14.5" r="1.8"/><circle cx="17.5" cy="14.5" r="1.8"/><path d="M8.5 4.5c2-1.3 5-1.3 7 0"/></svg>
    <div><div class="label">Caldera</div><div class="sub">Multi-room</div></div>
  </button>
  <button class="tile" data-src="youtube_music" style="--c: var(--ytm)">
    <span class="eq"><i></i><i></i><i></i></span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><path d="M10.8 10.2v3.6l3-1.8z" fill="currentColor"/></svg>
    <div><div class="label">YouTube Music</div><div class="sub">On this screen</div></div>
  </button>
  <button class="tile" data-src="bbc_sounds" style="--c: var(--bbc)">
    <span class="eq"><i></i><i></i><i></i></span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="8" width="18" height="12" rx="2"/><path d="M7 8l9-5"/><circle cx="15.5" cy="14" r="2.5"/><path d="M6 12h4M6 15h4"/></svg>
    <div><div class="label">BBC Sounds</div><div class="sub">Radio · podcasts</div></div>
  </button>
  <button class="tile" data-src="ha" style="--c: var(--ha)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 11.5L12 4l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/><circle cx="12" cy="14" r="2"/><path d="M12 16v4M10.5 12.6L8.5 11M13.5 12.6l2-1.6"/></svg>
    <div><div class="label">Home Assistant</div><div class="sub">Your dashboard</div></div>
  </button>
  <button class="tile" data-src="timer" style="--c: var(--timer)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9.5 2h5M12 2v3"/></svg>
    <div><div class="label">Timer</div><div class="sub">Intervals · countdown</div></div>
  </button>
</main>

<footer>
  <button class="btn" id="pause" title="Pause everything, or play again">
    <svg viewBox="0 0 24 24" fill="currentColor" id="pauseicon"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
    <span id="pauselabel">Pause all</span>
  </button>
  <div class="vol">
    <button class="btn" id="voldown" aria-label="Volume down">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 12h12"/></svg></button>
    <div class="bar"><b id="volbar"></b></div>
    <span class="volnum" id="volnum">–</span>
    <button class="btn" id="volup" aria-label="Volume up">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 12h12M12 6v12"/></svg></button>
  </div>
  <span id="shortcuts" style="display:contents"></span>
  <button class="btn" id="screenoff" title="Screen off">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
  </button>
</footer>

<script>
const $ = (id) => document.getElementById(id);
const post = (path, body) => fetch(path, {method: "POST", headers: {"Content-Type": "application/json"},
  body: JSON.stringify(body || {})}).then(r => r.json()).then(j => j.state && render(j.state)).catch(() => {});
const SUBS = {plexamp: "Your library", apple: "On this screen", airplay: "iPhone, iPad, Mac",
              spotify: "Spotify Connect", ma: "Your speakers", timer: "Intervals · countdown", bluetooth: "Any device", ha: "Your dashboard",
              caldera: "Multi-room", youtube_music: "On this screen", bbc_sounds: "Radio · podcasts"};
const ICON_PAUSE = '<rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/>';
const ICON_PLAY = '<path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/>';
const POWER = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v9"/><path d="M6.3 7.3a8 8 0 1 0 11.4 0"/></svg>';
const SPEAKER = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2.5" width="14" height="19" rx="2.5"/><circle cx="12" cy="14.5" r="3.5"/><circle cx="12" cy="7" r="1"/></svg>';
const iconFor = (name) => /sound|audio|speaker|receiver|onkyo|amp|sub/i.test(name) ? SPEAKER
  : /power|tv|fan|plug/i.test(name) ? POWER : BULB;
const BULB = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg>';
let scKey = "";
function renderShortcuts(list) {
  const key = list.map(x => x.id).join(",");
  if (key !== scKey) {
    scKey = key;
    $("shortcuts").innerHTML = list.map(x => `<button class="btn sc" data-sc="${x.id}" style="display:inline-flex">${iconFor(x.name)}<span></span></button>`).join("");
    $("shortcuts").querySelectorAll(".sc").forEach(b => b.onclick = () => post("/api/shortcut", {id: b.dataset.sc}));
  }
  list.forEach(x => { const b = $("shortcuts").querySelector(`[data-sc="${x.id}"]`);
    b.classList.toggle("on", !!x.on); b.querySelector("span").textContent = x.name; });
}

function setTrack(text) {
  const box = $("nptrack"), span = box.firstElementChild;
  if (span.textContent === text) return;
  span.textContent = text;
  box.classList.remove("long");
  requestAnimationFrame(() => {
    const over = span.scrollWidth - box.clientWidth;
    if (over > 4) {
      box.style.setProperty("--dx", `-${over + 8}px`);
      box.style.setProperty("--glide", `${Math.max(6, over / 25)}s`);
      box.classList.add("long");
    }
  });
}
function render(s) {
  $("name").textContent = s.player_name || "PlexPie";
  const tiles = [...document.querySelectorAll(".tile")];
  let shown = 0;
  tiles.forEach(t => {
    const src = t.dataset.src;
    const enabled = s.sources && src in s.sources;
    t.style.display = enabled ? "" : "none";
    if (!enabled) return;
    shown++;
    const playing = s.playing_by_source && s.playing_by_source[src];
    t.classList.toggle("playing", !!playing);
    const off = src === "ma" && !s.ma_up;
    t.classList.toggle("off", off);
    let sub = SUBS[src];
    const isNow = s.now_source === src;
    const cover = playing && isNow ? (s.art || "") : "";
    let cv = t.querySelector(".cover");
    if (!cv) { cv = document.createElement("span"); cv.className = "cover"; t.prepend(cv); }
    if (cv.dataset.url !== cover) { cv.dataset.url = cover; if (cover) cv.style.backgroundImage = `url("${cover}")`; }
    t.classList.toggle("has-cover", !!cover);
    if (playing) sub = isNow && s.now && s.now.title ? [s.now.title, s.now.artist].filter(Boolean).join(" — ") : "Playing";
    else if (off) sub = "Off — start it in Home Assistant";
    else if (src === "airplay") sub = `Pick “${s.player_name}”`;
    else if (src === "bluetooth" && s.bluetooth && s.bluetooth.connected) sub = s.bluetooth.connected;
    t.querySelector(".sub").textContent = sub;
  });
  fit(Math.max(shown, 1));
  renderShortcuts(s.shortcuts || []);
  $("pauseicon").innerHTML = s.playing ? ICON_PAUSE : ICON_PLAY;
  $("pauselabel").textContent = s.playing ? "Pause all" : (s.resume === "spotify" ? "Play Spotify" : "Play");
  document.body.classList.toggle("themed", !!s.accent);
  if (s.accent) document.body.style.setProperty("--art", s.accent);

  if (s.playing) {
    $("npchip").textContent = s.now_source_name;
    const n = s.now || {};
    setTrack([n.title, n.artist].filter(Boolean).join(" — "));
  } else {
    $("npchip").textContent = "Idle";
    setTrack("");
  }
  const v = s.volume;
  $("volbar").style.width = (v == null ? 0 : v) + "%";
  $("volnum").textContent = v == null ? "–" : v;
  const sl = s.sleep_left || 0;
  $("sleep").classList.toggle("on", sl > 0);
  $("sleepleft").textContent = sl > 0 ? (sl >= 60 ? Math.ceil(sl / 60) + "m" : sl + "s") : "";
}

// Pick the grid that gives the most comfortable tiles for this screen: one row on a wide
// screen, 2-3 rows of near-square tiles on square or portrait screens.
function fit(n) {
  const W = innerWidth, H = innerHeight, s = Math.min(W / 800, H / 480, 2.2);
  const root = document.body.style, px = v => Math.round(v) + "px";
  const short = Math.min(W, H);
  root.setProperty("--hh", px(Math.max(48, short * 0.11)));
  root.setProperty("--fh", px(Math.max(64, short * 0.15)));
  root.setProperty("--pad", px(Math.max(12, short * 0.028)));
  root.setProperty("--gap", px(Math.max(10, short * 0.025)));
  root.setProperty("--fs", px(Math.max(15, 16 * Math.max(1, s))));
  const z = Math.max(1, Math.min(s, 2));               // bars grow on big screens
  root.setProperty("--z", z.toFixed(2));
  root.setProperty("--hh", px(Math.max(48, short * 0.11, 54 * z)));
  root.setProperty("--fh", px(Math.max(64, short * 0.15, 76 * z)));
  const gridH = H - Math.max(48, short * 0.11, 54 * z) - Math.max(64, short * 0.15, 76 * z) - 2 * Math.max(10, short * 0.025);
  const gridW = W - 2 * Math.max(12, short * 0.028);
  let best = null;
  for (let cols = 1; cols <= n; cols++) {
    const rows = Math.ceil(n / cols), w = gridW / cols, h = gridH / rows;
    const ratio = w / h;                     // tiles look best between tall-ish (0.55) and square (1.1)
    const penalty = Math.abs(Math.log(ratio / 0.8)) + (rows * cols - n) * 0.15;
    if (!best || penalty < best.penalty) best = {cols, rows, penalty};
  }
  root.setProperty("--cols", best.cols); root.setProperty("--rows", best.rows);
}
addEventListener("resize", () => fit(document.querySelectorAll(".tile:not([style*='display: none'])").length || 4));

function renderAccess(list) {
  const r = (list || [])[0], el = document.getElementById("access");
  el.classList.toggle("hidden", !r);
  if (!r || el.dataset.id === r.id) return;
  el.dataset.id = r.id;
  el.innerHTML = `<b></b><small></small><div class="acts"><button class="ok" data-a="full">Allow</button>
    <button data-a="controls">Controls only</button><button class="no" data-a="deny">Deny</button></div>`;
  el.querySelector("b").textContent = r.name + " wants to connect";
  el.querySelector("small").textContent = "From " + r.ip + ". Allow gives it Settings; Controls only gives it the remote.";
}
document.getElementById("access").addEventListener("click", e => {
  const b = e.target.closest("[data-a]"); if (!b) return;
  const el = document.getElementById("access");
  fetch("/api/access", {method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({id: el.dataset.id, allow: b.dataset.a})}).then(() => { el.dataset.id = ""; el.classList.add("hidden"); });
});
function poll() { fetch("/api/state").then(r => r.json()).then(s => { render(s); renderAccess(s.access_requests); }).catch(() => {}); }
function clock() {
  const d = new Date();
  $("clock").textContent = d.toLocaleTimeString([], {hour: "numeric", minute: "2-digit"});
}

document.querySelectorAll(".tile").forEach(t =>
  t.addEventListener("click", () => post("/api/source", {source: t.dataset.src})));
$("pause").onclick = () => post("/api/playpause");
$("volup").onclick = () => post("/api/volume", {delta: 5});
$("voldown").onclick = () => post("/api/volume", {delta: -5});
$("screenoff").onclick = () => post("/api/screen", {on: false});
$("sleep").onclick = () => post("/api/sleep");
$("gear").onclick = () => post("/api/source", {source: "settings"});

clock(); poll();
setInterval(clock, 5000);
setInterval(poll, 1000);
</script>
</body>
</html>
