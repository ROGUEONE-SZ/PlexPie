// PlexPie AirPlay 2 receiver. Generated by install.sh from plexpie.conf.
general = {
  name = "@AIRPLAY_NAME@";
  output_backend = "alsa";
  interpolation = "soxr";
};

sessioncontrol = {
  allow_session_interruption = "yes";
  session_timeout = 60;
};

alsa = {
  output_device = "default";
};

metadata = {
  enabled = "yes";
  include_cover_art = "yes";
  pipe_name = "/tmp/shairport-sync-metadata";
  pipe_timeout = 5000;
};
