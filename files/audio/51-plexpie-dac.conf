# PlexPie: prefer the USB DAC over HDMI and the headphone jack.
# The pattern comes from DAC_MATCH in plexpie.conf (default: any USB audio device).
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~@DAC_MATCH@" } ]
    actions = {
      update-props = {
        priority.session = 2000
        priority.driver = 2000
      }
    }
  }
]
