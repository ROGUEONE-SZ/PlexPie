# PlexPie: every ALSA program (Plexamp, AirPlay, Squeezelite) plays through
# PipeWire, which mixes them onto the DAC. Unplugging the DAC no longer
# breaks playback; PipeWire just waits for it to come back.
pcm.!default {
    type pipewire
    playback_node "-1"
    capture_node "-1"
    hint {
        show on
        description "PipeWire"
    }
}

ctl.!default {
    type pipewire
}
