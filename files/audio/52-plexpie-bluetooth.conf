# PlexPie: let phones play to this player over Bluetooth (A2DP), and play what they send
# straight to the default output, like any other app.
monitor.bluez.properties = {
  bluez5.roles = [ a2dp_sink a2dp_source ]
  bluez5.codecs = [ sbc sbc_xq aac ldac aptx aptx_hd ]
}
monitor.bluez.rules = [
  {
    matches = [ { node.name = "~bluez_input.*" } ]
    actions = { update-props = { node.description = "Bluetooth (phone)" } }
  }
]
