# PlexPie Spotify Connect receiver (go-librespot). Generated by install.sh.
device_name: "@AIRPLAY_NAME@"
device_type: speaker
audio_backend: alsa
audio_device: default
bitrate: 320
zeroconf_enabled: true
zeroconf_backend: avahi
credentials:
  type: zeroconf
  zeroconf:
    persist_credentials: true
server:
  enabled: true
  address: 127.0.0.1
  port: 3678
