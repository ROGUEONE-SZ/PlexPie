<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Inter, Helvetica, Arial, sans-serif">
<rect width="100%" height="100%" rx="18" fill="#f6f6f9"/>
<text x="40" y="48" font-size="20" font-weight="800" fill="#16161c">Optional buttons on the Pi's pin header</text>
<text x="40" y="74" font-size="13" fill="#5b5b66">Pins 1–16 of 40 shown. Pin 1 is at the end nearest the memory card; odd pins are the inner row, even pins the outer edge.</text>
<rect x="330" y="80" width="112" height="384" rx="10" fill="#1e2a20"/>
<circle cx="360" cy="110" r="13" fill="#f5a524" stroke="#ffffff" stroke-width="2"/>
<text x="360" y="114" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">1</text>
<line x1="344" y1="110" x2="290" y2="110" stroke="#f5a524" stroke-width="2"/>
<text x="282" y="108" font-size="14" font-weight="700" fill="#16161c" text-anchor="end">Knob +</text>
<text x="282" y="124" font-size="11" fill="#5b5b66" text-anchor="end">pin 1 · 3.3V</text>
<circle cx="412" cy="110" r="13" fill="#8c8c96" stroke="#ffffff" stroke-width="2"/>
<text x="412" y="114" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">2</text>
<circle cx="360" cy="156" r="13" fill="#8c8c96" stroke="#ffffff" stroke-width="2"/>
<text x="360" y="160" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">3</text>
<circle cx="412" cy="156" r="13" fill="#8c8c96" stroke="#ffffff" stroke-width="2"/>
<text x="412" y="160" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">4</text>
<circle cx="360" cy="202" r="13" fill="#ff5a4f" stroke="#ffffff" stroke-width="2"/>
<text x="360" y="206" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">5</text>
<line x1="344" y1="202" x2="290" y2="202" stroke="#ff5a4f" stroke-width="2"/>
<text x="282" y="200" font-size="14" font-weight="700" fill="#16161c" text-anchor="end">Power button</text>
<text x="282" y="216" font-size="11" fill="#5b5b66" text-anchor="end">pin 5 · GPIO3</text>
<circle cx="412" cy="202" r="13" fill="#16161c" stroke="#ffffff" stroke-width="2"/>
<text x="412" y="206" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">6</text>
<line x1="428" y1="202" x2="482" y2="202" stroke="#16161c" stroke-width="2"/>
<text x="490" y="200" font-size="14" font-weight="700" fill="#16161c">Power button</text>
<text x="490" y="216" font-size="11" fill="#5b5b66">pin 6 · GND</text>
<circle cx="360" cy="248" r="13" fill="#8c8c96" stroke="#ffffff" stroke-width="2"/>
<text x="360" y="252" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">7</text>
<circle cx="412" cy="248" r="13" fill="#8c8c96" stroke="#ffffff" stroke-width="2"/>
<text x="412" y="252" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">8</text>
<circle cx="360" cy="294" r="13" fill="#16161c" stroke="#ffffff" stroke-width="2"/>
<text x="360" y="298" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">9</text>
<line x1="344" y1="294" x2="290" y2="294" stroke="#16161c" stroke-width="2"/>
<text x="282" y="292" font-size="14" font-weight="700" fill="#16161c" text-anchor="end">Knob GND</text>
<text x="282" y="308" font-size="11" fill="#5b5b66" text-anchor="end">pin 9 · GND</text>
<circle cx="412" cy="294" r="13" fill="#8c8c96" stroke="#ffffff" stroke-width="2"/>
<text x="412" y="298" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">10</text>
<circle cx="360" cy="340" r="13" fill="#3b8cf6" stroke="#ffffff" stroke-width="2"/>
<text x="360" y="344" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">11</text>
<line x1="344" y1="340" x2="290" y2="340" stroke="#3b8cf6" stroke-width="2"/>
<text x="282" y="338" font-size="14" font-weight="700" fill="#16161c" text-anchor="end">Knob A (CLK)</text>
<text x="282" y="354" font-size="11" fill="#5b5b66" text-anchor="end">pin 11 · GPIO17</text>
<circle cx="412" cy="340" r="13" fill="#8c8c96" stroke="#ffffff" stroke-width="2"/>
<text x="412" y="344" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">12</text>
<circle cx="360" cy="386" r="13" fill="#3b8cf6" stroke="#ffffff" stroke-width="2"/>
<text x="360" y="390" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">13</text>
<line x1="344" y1="386" x2="290" y2="386" stroke="#3b8cf6" stroke-width="2"/>
<text x="282" y="384" font-size="14" font-weight="700" fill="#16161c" text-anchor="end">Knob B (DT)</text>
<text x="282" y="400" font-size="11" fill="#5b5b66" text-anchor="end">pin 13 · GPIO27</text>
<circle cx="412" cy="386" r="13" fill="#8c8c96" stroke="#ffffff" stroke-width="2"/>
<text x="412" y="390" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">14</text>
<circle cx="360" cy="432" r="13" fill="#19c2a8" stroke="#ffffff" stroke-width="2"/>
<text x="360" y="436" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">15</text>
<line x1="344" y1="432" x2="290" y2="432" stroke="#19c2a8" stroke-width="2"/>
<text x="282" y="430" font-size="14" font-weight="700" fill="#16161c" text-anchor="end">Knob push (SW)</text>
<text x="282" y="446" font-size="11" fill="#5b5b66" text-anchor="end">pin 15 · GPIO22</text>
<circle cx="412" cy="432" r="13" fill="#8c8c96" stroke="#ffffff" stroke-width="2"/>
<text x="412" y="436" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">16</text>
<text x="40" y="510" font-size="13" fill="#16161c"><tspan font-weight="700">Power button</tspan> (POWER_BUTTON="yes"): any push button between pins 5 and 6. Press to shut down, press again to start.</text>
<text x="40" y="534" font-size="13" fill="#16161c"><tspan font-weight="700">Rotary knob</tspan> (KNOB="yes"): a KY-040 style module. Turn for volume, press to pause or play, hold to go home.</text>
</svg>